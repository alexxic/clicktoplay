<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open website</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #urlScreen {
      width: 80%;
      max-width: 1100px;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 36px;
    }

    form {
      display: flex;
      gap: 16px;
    }

    #urlInput {
      flex: 1;
      min-width: 0;
      padding: 18px;
      border: 3px solid #555;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 26px;
    }

    #urlInput:focus {
      border-color: #4da3ff;
      outline: none;
    }

    button {
      padding: 0 28px;
      border: 0;
      border-radius: 8px;
      background: #2878d0;
      color: #fff;
      font-size: 26px;
    }

    button:focus {
      outline: 4px solid #fff;
      outline-offset: 3px;
    }

    #error {
      min-height: 32px;
      margin-top: 16px;
      color: #ff8585;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <main id="urlScreen">
    <h1>Enter website address</h1>

    <form id="urlForm">
      <input
        id="urlInput"
        type="url"
        inputmode="url"
        autocomplete="off"
        spellcheck="false"
        placeholder="https://puzzle-movies.com/"
        value="https://puzzle-movies.com/"
        aria-label="Website URL">

      <button id="openButton" type="submit">Open</button>
    </form>

    <div id="error" role="alert"></div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('urlForm');
      const input = document.getElementById('urlInput');
      const error = document.getElementById('error');
      const LAST_URL_KEY = 'lastUrl';

      const savedUrl = localStorage.getItem(LAST_URL_KEY);

      if (savedUrl) {
        input.value = savedUrl;
      }

      function normalizeUrl(value) {
        let url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        const parsed = new URL(url);

        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
          throw new Error('Only HTTP and HTTPS addresses are supported.');
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          const url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);
          window.location.replace(url);
        } catch (e) {
          error.textContent = e.message;
          input.focus();
        }
      }

      form.addEventListener('submit', openUrl);

      input.addEventListener('input', function () {
        error.textContent = '';
      });

      window.addEventListener('load', function () {
        input.focus();
        input.select();
      });
    })();
  </script>
</body>
</html>
