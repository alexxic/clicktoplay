<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open website</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #scrollArea {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8vh 10vw;
      outline: none;
      scroll-behavior: smooth;
    }

    #urlScreen {
      box-sizing: border-box;
      width: 100%;
      max-width: 1100px;
      min-height: 84vh;
      margin: 0 auto;
      padding-bottom: 10vh;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 36px;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    #urlInput {
      box-sizing: border-box;
      flex: 1 1 600px;
      min-width: 0;
      padding: 18px;
      border: 3px solid #555;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 26px;
    }

    #urlInput:focus {
      border-color: #4da3ff;
      outline: none;
    }

    button {
      min-height: 68px;
      padding: 0 28px;
      border: 0;
      border-radius: 8px;
      background: #2878d0;
      color: #fff;
      font-size: 26px;
    }

    button:focus {
      outline: 4px solid #fff;
      outline-offset: 3px;
    }

    #error {
      min-height: 32px;
      margin-top: 16px;
      color: #ff8585;
      font-size: 22px;
    }

    .help {
      margin-top: 48px;
      color: #aaa;
      font-size: 22px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main id="scrollArea" tabindex="0">
    <section id="urlScreen">
      <h1>Enter website address</h1>

      <form id="urlForm">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://puzzle-movies.com/"
          value="https://puzzle-movies.com/"
          aria-label="Website URL">

        <button id="openButton" type="submit">Open</button>
      </form>

      <div id="error" role="alert"></div>

      <p class="help">
        Use the Magic Remote wheel or Up and Down buttons to scroll.
        Press OK to open the address.
      </p>
    </section>
  </main>

  <script>
    (function () {
      const scrollArea = document.getElementById('scrollArea');
      const form = document.getElementById('urlForm');
      const input = document.getElementById('urlInput');
      const error = document.getElementById('error');
      const LAST_URL_KEY = 'lastUrl';
      const SCROLL_STEP = 180;

      const savedUrl = localStorage.getItem(LAST_URL_KEY);

      if (savedUrl) {
        input.value = savedUrl;
      }

      function normalizeUrl(value) {
        let url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        const parsed = new URL(url);

        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
          throw new Error('Only HTTP and HTTPS addresses are supported.');
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          const url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);
          window.location.replace(url);
        } catch (e) {
          error.textContent = e.message;
          input.focus();
        }
      }

      function handleRemoteScroll(event) {
        const key = event.key;
        const keyCode = event.keyCode;

        const isUp = key === 'ArrowUp' || keyCode === 38;
        const isDown = key === 'ArrowDown' || keyCode === 40;

        if (!isUp && !isDown) {
          return;
        }

        const activeElement = document.activeElement;

        // Allow the URL input to handle its own cursor movement.
        if (activeElement === input && !event.ctrlKey && !event.altKey) {
          return;
        }

        event.preventDefault();

        scrollArea.scrollBy({
          top: isUp ? -SCROLL_STEP : SCROLL_STEP,
          left: 0,
          behavior: 'smooth'
        });
      }

      form.addEventListener('submit', openUrl);

      input.addEventListener('input', function () {
        error.textContent = '';
      });

      document.addEventListener('keydown', handleRemoteScroll);

      window.addEventListener('load', function () {
        input.focus();
        input.select();
      });
    })();
  </script>
</body>
</html>
