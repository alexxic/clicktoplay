<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>FlixPlayer</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main id="scrollArea" tabindex="0">
    <section id="urlScreen">
      <h1>Enter website address</h1>

      <form id="urlForm">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://puzzle-movies.com/"
          value="https://puzzle-movies.com/"
          aria-label="Website URL">

        <button id="openButton" type="submit">
          Open
        </button>
      </form>

      <div id="error" role="alert"></div>

      <p class="help">
        Use the Magic Remote wheel or the Up and Down buttons to scroll.
        Select the address field and press OK to type.
        Press OK on Open to navigate.
      </p>
    </section>
  </main>

  <script>
    (function () {
      const scrollArea = document.getElementById('scrollArea');
      const form = document.getElementById('urlForm');
      const input = document.getElementById('urlInput');
      const openButton = document.getElementById('openButton');
      const error = document.getElementById('error');

      const LAST_URL_KEY = 'lastUrl';
      const SCROLL_STEP = 180;

      let isKeyboardVisible = false;

      const savedUrl = localStorage.getItem(LAST_URL_KEY);

      if (savedUrl) {
        input.value = savedUrl;
      }

      function normalizeUrl(value) {
        let url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        const parsed = new URL(url);

        if (
          parsed.protocol !== 'http:' &&
          parsed.protocol !== 'https:'
        ) {
          throw new Error(
            'Only HTTP and HTTPS addresses are supported.'
          );
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          const url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);
          window.location.replace(url);
        } catch (e) {
          error.textContent = e.message;
          input.focus();
        }
      }

      function scrollPage(amount) {
        scrollArea.scrollTop += amount;
      }

      function handleRemoteKey(event) {
        const key = event.key;
        const keyCode = event.keyCode || event.which;

        const isUp =
          key === 'ArrowUp' ||
          keyCode === 38;

        const isDown =
          key === 'ArrowDown' ||
          keyCode === 40;

        if (!isUp && !isDown) {
          return;
        }

        /*
         * Let the virtual keyboard handle navigation while
         * the URL input is active.
         */
        if (
          document.activeElement === input &&
          isKeyboardVisible
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        scrollPage(isUp ? -SCROLL_STEP : SCROLL_STEP);
      }

      function restorePageFocus() {
        setTimeout(function () {
          scrollArea.focus();
        }, 100);
      }

      window.addEventListener(
        'keyboardStateChange',
        function (event) {
          const detail = event.detail || event;

          isKeyboardVisible =
            detail.visibility === true ||
            detail.visibility === 'visible';

          if (!isKeyboardVisible) {
            restorePageFocus();
          }
        }
      );

      input.addEventListener('focus', function () {
        isKeyboardVisible = true;
      });

      input.addEventListener('blur', function () {
        isKeyboardVisible = false;
        restorePageFocus();
      });

      input.addEventListener('input', function () {
        error.textContent = '';
      });

      openButton.addEventListener('focus', function () {
        scrollArea.scrollIntoView({
          block: 'nearest',
          behavior: 'smooth'
        });
      });

      form.addEventListener('submit', openUrl);

      /*
       * Capture the remote key before default browser focus
       * navigation consumes it.
       */
      document.addEventListener(
        'keydown',
        handleRemoteKey,
        true
      );

      window.addEventListener('load', function () {
        scrollArea.focus();
      });
    })();
  </script>
</body>
</html>
