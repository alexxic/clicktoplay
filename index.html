<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>FlixPlayer</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main id="page">
    <section id="urlScreen">
      <h1>Enter website address</h1>

      <form id="urlForm">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://puzzle-movies.com/"
          aria-label="Website URL">

        <button id="openButton" type="submit">
          Open
        </button>
      </form>

      <div id="error" role="alert"></div>

      <p class="help">
        Press OK to open the website in the LG browser.
      </p>
    </section>
  </main>

  <div id="buildVersion">
    Build __BUILD_VERSION__
  </div>

  <script src="js/webOSTV.js"></script>

  <script>
    (function () {
      var form = document.getElementById('urlForm');
      var input = document.getElementById('urlInput');
      var error = document.getElementById('error');

      var LAST_URL_KEY = 'lastUrl';

      var savedUrl = localStorage.getItem(LAST_URL_KEY);

      input.value = savedUrl || 'https://puzzle-movies.com/';

      function normalizeUrl(value) {
        var url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        var parsed = new URL(url);

        if (
          parsed.protocol !== 'http:' &&
          parsed.protocol !== 'https:'
        ) {
          throw new Error(
            'Only HTTP and HTTPS addresses are supported.'
          );
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          var url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);

          if (
            !window.webOS ||
            !window.webOS.service ||
            typeof window.webOS.service.request !== 'function'
          ) {
            throw new Error(
              'webOS service API is not available.'
            );
          }

          window.webOS.service.request(
            'luna://com.webos.applicationManager',
            {
              method: 'launch',
              parameters: {
                id: 'com.webos.app.browser',
                params: {
                  target: url
                }
              },
              onSuccess: function () {
                console.log('Browser launched');
              },
              onFailure: function (response) {
                console.log(
                  'Launch failed:',
                  JSON.stringify(response)
                );

                error.textContent =
                  'Could not launch the LG browser.';
              }
            }
          );
        } catch (err) {
          error.textContent = err.message;
          input.focus();
        }
      }

      form.addEventListener('submit', openUrl);

      input.addEventListener('input', function () {
        error.textContent = '';
      });
    })();
  </script>
</body>
</html>
