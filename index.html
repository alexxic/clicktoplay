<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>FlixPlayer</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main id="page">
    <section id="urlScreen">
      <h1>Enter website address</h1>

      <form id="urlForm">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://puzzle-movies.com/"
          aria-label="Website URL">

        <button id="openButton" type="submit">
          Open
        </button>
      </form>

      <div id="error" role="alert"></div>

      <p class="help">
        Enter a website address and press Open.
        The website will load directly in the TV app.
      </p>
    </section>
  </main>

  <div
    id="buildVersion"
    aria-label="Build version">
    Build __BUILD_VERSION__
  </div>

  <script>
    (function () {
      var form = document.getElementById('urlForm');
      var input = document.getElementById('urlInput');
      var error = document.getElementById('error');

      var LAST_URL_KEY = 'lastUrl';

      var savedUrl = localStorage.getItem(LAST_URL_KEY);

      if (savedUrl) {
        input.value = savedUrl;
      } else {
        input.value = 'https://puzzle-movies.com/';
      }

      function normalizeUrl(value) {
        var url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        var parsed = new URL(url);

        if (
          parsed.protocol !== 'http:' &&
          parsed.protocol !== 'https:'
        ) {
          throw new Error(
            'Only HTTP and HTTPS addresses are supported.'
          );
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          var url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);

          /*
           * Direct navigation avoids iframe restrictions.
           * The destination site controls its own scrolling,
           * fullscreen behavior, login, and video player.
           */
          window.location.replace(url);
        } catch (err) {
          error.textContent = err.message;
          input.focus();
        }
      }

      form.addEventListener('submit', openUrl);

      input.addEventListener('input', function () {
        error.textContent = '';
      });
    })();
  </script>
</body>
</html>
