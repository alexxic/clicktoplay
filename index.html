<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlixPlayer</title>
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main id="page">
    <section id="urlScreen">
      <h1>Enter website address</h1>

      <form id="urlForm">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://puzzle-movies.com/"
          aria-label="Website URL">

        <button id="openButton" type="submit">
          Open
        </button>
      </form>

      <div id="error" role="alert"></div>

      <p class="help">
        Use the Magic Remote wheel or the Up and Down buttons to scroll.
        Select the address field and press OK to type.
        Press OK on Open to navigate.
      </p>

      <div class="spacer" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById('urlForm');
      const input = document.getElementById('urlInput');
      const error = document.getElementById('error');

      const LAST_URL_KEY = 'lastUrl';
      const SCROLL_STEP = 220;

      const savedUrl = localStorage.getItem(LAST_URL_KEY);

      if (savedUrl) {
        input.value = savedUrl;
      } else {
        input.value = 'https://puzzle-movies.com/';
      }

      function normalizeUrl(value) {
        let url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        const parsed = new URL(url);

        if (
          parsed.protocol !== 'http:' &&
          parsed.protocol !== 'https:'
        ) {
          throw new Error(
            'Only HTTP and HTTPS addresses are supported.'
          );
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          const url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);
          window.location.replace(url);
        } catch (err) {
          error.textContent = err.message;
          input.focus();
        }
      }

      function scrollPage(amount) {
        window.scrollBy(0, amount);
      }

      function handleRemoteKey(event) {
        const code = event.keyCode || event.which;
        const key = event.key;

        const up =
          key === 'ArrowUp' ||
          code === 38 ||
          code === 107;

        const down =
          key === 'ArrowDown' ||
          code === 40 ||
          code === 108;

        const wheelUp = code === 402;
        const wheelDown = code === 403;

        if (up || wheelUp) {
          event.preventDefault();
          event.stopPropagation();
          scrollPage(-SCROLL_STEP);
          return false;
        }

        if (down || wheelDown) {
          event.preventDefault();
          event.stopPropagation();
          scrollPage(SCROLL_STEP);
          return false;
        }

        return true;
      }

      form.addEventListener('submit', openUrl);

      input.addEventListener('input', function () {
        error.textContent = '';
      });

      /*
       * Use both keydown and keyup because older webOS versions
       * can expose remote events differently.
       */
      document.addEventListener(
        'keydown',
        handleRemoteKey,
        true
      );

      document.addEventListener(
        'keyup',
        handleRemoteKey,
        true
      );
    })();
  </script>
</body>
</html>
