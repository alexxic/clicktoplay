<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>FlixPlayer</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main id="page">
    <section id="urlScreen">
      <h1>Enter website address</h1>

      <form id="urlForm">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://puzzle-movies.com/"
          aria-label="Website URL">

        <button id="openButton" type="submit">
          Open
        </button>
      </form>

      <div id="error" role="alert"></div>

      <p class="help">
        Move the Magic Remote pointer over the page and rotate the wheel
        to scroll. Use Up and Down in five-way mode.
      </p>

      <div class="bottom-space" aria-hidden="true"></div>
    </section>
  </main>

  <div
    id="buildVersion"
    aria-label="Build version">
    Build __BUILD_VERSION__
  </div>

  <script>
    (function () {
      var form = document.getElementById('urlForm');
      var input = document.getElementById('urlInput');
      var error = document.getElementById('error');

      var LAST_URL_KEY = 'lastUrl';
      var SCROLL_STEP = 180;

      var savedUrl = localStorage.getItem(LAST_URL_KEY);

      if (savedUrl) {
        input.value = savedUrl;
      } else {
        input.value = 'https://puzzle-movies.com/';
      }

      function normalizeUrl(value) {
        var url = value.trim();

        if (!url) {
          throw new Error('Enter a website address.');
        }

        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        var parsed = new URL(url);

        if (
          parsed.protocol !== 'http:' &&
          parsed.protocol !== 'https:'
        ) {
          throw new Error(
            'Only HTTP and HTTPS addresses are supported.'
          );
        }

        return parsed.href;
      }

      function openUrl(event) {
        event.preventDefault();
        error.textContent = '';

        try {
          var url = normalizeUrl(input.value);

          localStorage.setItem(LAST_URL_KEY, url);
          window.location.replace(url);
        } catch (err) {
          error.textContent = err.message;
          input.focus();
        }
      }

      function scrollByAmount(amount) {
        window.scrollBy(0, amount);
      }

      function handleArrowKey(event) {
        var code = event.keyCode || event.which;
        var key = event.key;

        var isUp =
          key === 'ArrowUp' ||
          code === 38;

        var isDown =
          key === 'ArrowDown' ||
          code === 40;

        if (isUp) {
          event.preventDefault();
          scrollByAmount(-SCROLL_STEP);
        }

        if (isDown) {
          event.preventDefault();
          scrollByAmount(SCROLL_STEP);
        }
      }

      function handleWheel(event) {
        var delta = 0;

        if (typeof event.deltaY === 'number') {
          delta = event.deltaY;
        } else if (typeof event.wheelDelta === 'number') {
          delta = -event.wheelDelta;
        } else if (typeof event.detail === 'number') {
          delta = event.detail * 40;
        }

        if (!delta) {
          return;
        }

        event.preventDefault();

        if (delta > 0) {
          scrollByAmount(Math.max(SCROLL_STEP, delta));
        } else {
          scrollByAmount(Math.min(-SCROLL_STEP, delta));
        }
      }

      form.addEventListener('submit', openUrl);

      input.addEventListener('input', function () {
        error.textContent = '';
      });

      document.addEventListener(
        'keydown',
        handleArrowKey,
        false
      );

      document.addEventListener(
        'wheel',
        handleWheel,
        { passive: false }
      );

      document.addEventListener(
        'mousewheel',
        handleWheel,
        false
      );

      document.addEventListener(
        'DOMMouseScroll',
        handleWheel,
        false
      );
    })();
  </script>
</body>
</html>
