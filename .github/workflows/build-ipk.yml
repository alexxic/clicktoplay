name: Build and release webOS IPK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LG webOS IPK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Show tool versions
        run: |
          node --version
          npm --version
          ares-package --version

      - name: Validate project
        run: |
          test -f appinfo.json
          test -f index.html
          test -f css/app.css

      - name: Build IPK
        run: |
          rm -rf build
          mkdir -p build
          ares-package . --outdir build

      - name: List generated files
        run: ls -lah build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixplayer-ipk
          path: build/*.ipk
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPK to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: build/*.ipk
          fail_on_unmatched_files: true
