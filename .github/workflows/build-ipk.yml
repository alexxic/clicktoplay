name: Build and release webOS IPK

on:
  release:
    types:
      - published

  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.2.4 or 0.2.4-beta.1'
        required: true
        default: '0.2.4'

permissions:
  contents: write

jobs:
  prepare-version:
    name: Update version files
    runs-on: ubuntu-22.04

    # Do not run the version-commit job for the bot's own version commit.
    if: github.actor != 'github-actions[bot]'

    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.target.outputs.branch }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Determine target branch
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TARGET_BRANCH="${{ github.event.release.target_commitish }}"
          else
            TARGET_BRANCH="main"
          fi

          if [[ -z "$TARGET_BRANCH" ]]; then
            TARGET_BRANCH="main"
          fi

          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.VERSION;

          const appInfo = JSON.parse(
            fs.readFileSync('appinfo.json', 'utf8')
          );

          appInfo.version = version;

          fs.writeFileSync(
            'appinfo.json',
            JSON.stringify(appInfo, null, 2) + '\n'
          );

          const packageJson = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          packageJson.version = version;

          fs.writeFileSync(
            'package.json',
            JSON.stringify(packageJson, null, 2) + '\n'
          );
          NODE

      - name: Commit version files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add appinfo.json package.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore: set version to ${VERSION}"
          git push origin "HEAD:${TARGET_BRANCH}"
