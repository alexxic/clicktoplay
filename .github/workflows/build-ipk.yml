name: Build webOS IPK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package LG webOS app
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Show CLI version
        run: ares-package --version

      - name: Validate required files
        run: |
          test -f appinfo.json
          test -f index.html
          test -f css/app.css

      - name: Build IPK
        run: |
          mkdir -p build
          ares-package . --outdir build

      - name: List build output
        run: ls -lah build

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixplayer-webos-ipk
          path: build/*.ipk
          if-no-files-found: error
          retention-days: 30
